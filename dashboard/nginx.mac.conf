# Static dashboard for the Mac profile. The regular nginx.conf is for the
# public openshorts.app host and contains redirects that are wrong on localhost.
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Large local uploads should stream to FastAPI instead of filling nginx's
    # temporary request buffer. The API enforces its own upload size limit.
    client_max_body_size 2048m;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    resolver 127.0.0.11 ipv6=off valid=30s;

    location ~ ^/(api|videos|thumbnails|gallery|video)(/|$) {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream$request_uri;
    }

    location ~ ^/render(/|$) {
        # Resolve on request so the dashboard still starts when the optional
        # renderer has not been started for a clipping-only session.
        set $renderer_upstream renderer:3100;
        proxy_pass http://$renderer_upstream$request_uri;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
